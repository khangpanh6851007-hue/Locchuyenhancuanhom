<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lộc Chuyên Hàn Cửa Nhôm - Vĩnh Long</title>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #00d2ff;
            --secondary-color: #3a7bd5;
            --bg-dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--text-color);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Tối ưu cho màn hình điện thoại / Acode preview */
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Header Style */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* 1 & 2. Widget Đồng hồ & Lịch tự động */
        .widget-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clock-section, .calendar-section {
            text-align: center;
            flex: 1;
        }

        .clock-section {
            border-right: 1px solid var(--border-color);
        }

        .widget-title {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .date-display {
            font-size: 0.85rem;
            font-weight: 500;
            color: #fff;
        }

        /* Services Section */
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
        }

        .service-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .service-card i {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .service-card span {
            font-size: 0.75rem;
            font-weight: 500;
            display: block;
        }

        /* Địa chỉ liên hệ */
        .location-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .location-box i {
            color: #ef4444;
            font-size: 1.1rem;
            margin-top: 3px;
        }

        .location-box .info h4 {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .location-box .info p {
            font-size: 0.72rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* Google Map nhúng trực tiếp */
        .map-container {
            width: 100%;
            height: 160px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Nút hành động / Gọi nhanh */
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Lộc Chuyên Hàn Cửa Nhôm</h1>
            <p>Uy tín - Chất lượng - Chuyên nghiệp tại Vĩnh Long</p>
        </div>

        <!-- Tính năng 1 & 2: Đồng hồ & Lịch tự động -->
        <div class="widget-box">
            <div class="clock-section">
                <div class="widget-title"><i class="fa-regular fa-clock"></i> Thời gian</div>
                <div id="live-clock" class="time-display">00:00:00</div>
            </div>
            <div class="calendar-section">
                <div class="widget-title"><i class="fa-regular fa-calendar-days"></i> Hôm nay</div>
                <div id="live-date" class="date-display">Đang tải...</div>
            </div>
        </div>

        <!-- Dịch vụ cung cấp -->
        <div class="section-title">
            <i class="fa-solid fa-screwdriver-wrench"></i> Dịch Vụ Cốt Lõi
        </div>
        <div class="services-grid">
            <div class="service-card">
                <i class="fa-solid fa-door-open"></i>
                <span>Cửa Nhôm Kính</span>
            </div>
            <div class="service-card">
                <i class="fa-solid fa-fire-burner"></i>
                <span>Hàn Xì Cửa Sắt</span>
            </div>
            <div class="service-card">
                <i class="fa-solid fa-window-maximize"></i>
                <span>Kính Cường Lực</span>
            </div>
            <div class="service-card">
                <i class="fa-solid fa-screwdriver"></i>
                <span>Sửa Chữa Tận Nơi</span>
            </div>
        </div>

        <!-- Địa chỉ cơ sở -->
        <div class="location-box">
            <i class="fa-solid fa-location-dot"></i>
            <div class="info">
                <h4>Địa Chỉ Cơ Sở</h4>
                <p>Ấp Tân An, Xã Tân Thành Bình, Tỉnh Vĩnh Long.</p>
            </div>
        </div>

        <!-- Tích hợp Google Map trực tiếp -->
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.508591873136!2d106.2!3d10.2!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTDCsDEyJzAwLjAiTiAxMDbCsDEyJzAwLjAiRQ!5e0!3m2!1svi!2svn!4v1650000000000!5m2!1svi!2svn" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <!-- Nút gọi nhanh Hotline & Mở bản đồ lớn -->
        <div class="action-buttons">
            <a href="tel:0385555555" class="btn btn-primary">
                <i class="fa-solid fa-phone-volume"></i> Gọi Ngay
            </a>
            <a href="https://maps.app.goo.gl/jWmD2My518UjSZpcA" target="_blank" class="btn btn-secondary">
                <i class="fa-solid fa-map-location-dot"></i> Bản Đồ Lớn
            </a>
        </div>
    </div>

    <!-- JavaScript xử lý đồng hồ & lịch tự động theo thời gian thực -->
    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Cập nhật Đồng hồ tự động
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;

            // Cập nhật Lịch tự động
            const days = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
            let dayName = days[now.getDay()];
            let date = String(now.getDate()).padStart(2, '0');
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let year = now.getFullYear();
            
            document.getElementById('live-date').textContent = `${dayName}, ${date}/${month}/${year}`;
        }

        // Chạy ngay lập tức và lặp lại mỗi giây
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
